# CI workflow (ADR-0021: SHA-pinned actions, least privilege): the job verify
# is the required check. Actions use full commit SHA pins, the token has only
# contents read, and checkout does not persist credentials.
name: CI

on:
  pull_request: {}
  push:
    branches:
      - main
  merge_group: {}

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - run: make ci BASE="$BASE"
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || '' }}
